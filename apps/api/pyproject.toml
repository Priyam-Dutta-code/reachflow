[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 long lines (handled by judgment), B008 FastAPI Depends-in-default idiom,
# UP017 datetime.UTC (py3.11+ only)
ignore = ["E501", "B008", "UP017"]
