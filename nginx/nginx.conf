# nginx/nginx.conf
# Reverse proxy for ReachFlow backend
# Handles HTTP → HTTPS redirect and SSL termination

events {
    worker_connections 1024;
}

http {

    # ── Rate limiting ──────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain;

    # ── HTTP → HTTPS redirect ─────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS API server ──────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.yourdomain.com;   # ← replace with your server IP or domain

        # SSL — generated by certbot (see DEPLOY.md)
        ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options        DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # CORS preflight — handled by FastAPI but nginx can short-circuit
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Auth endpoints — stricter rate limit
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://backend:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # All other API routes
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://backend:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # ── HTTP-only fallback (if no SSL cert yet) ───────────
    # Uncomment this block and comment out the HTTPS block above
    # while you're setting up:
    #
    # server {
    #     listen 80;
    #     server_name _;
    #     location / {
    #         proxy_pass http://backend:8000;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #     }
    # }
}
