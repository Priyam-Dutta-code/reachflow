# Nightly encrypted database backup with offsite copy (D-001: own the backups
# since Supabase free has none). Dumps Postgres, gzips, encrypts with openssl,
# pushes to a free rclone remote (Cloudflare R2 / Google Drive), prunes >14d.
#
# [HUMAN: Priyam] set repo secrets:
#   DATABASE_URL      Supabase Postgres connection string (session pooler)
#   BACKUP_PASSPHRASE  long random — needed to DECRYPT; store it somewhere safe
#   RCLONE_CONF        contents of ~/.config/rclone/rclone.conf for the remote
#   BACKUP_REMOTE      e.g. r2:reachflow-backups  (remote:bucket/path)
# Leave them unset and the job no-ops cleanly (logs why).
name: backup

on:
  schedule:
    - cron: "30 19 * * *" # 01:00 IST nightly
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secrets present
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_REMOTE: ${{ secrets.BACKUP_REMOTE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ] || [ -z "$BACKUP_REMOTE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Backup secrets not set — skipping (see workflow header)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install postgresql-client + rclone
        if: steps.guard.outputs.configured == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-client rclone

      - name: Dump, encrypt, push, prune
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_REMOTE: ${{ secrets.BACKUP_REMOTE }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          file="reachflow-${stamp}.sql.gz.enc"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges \
            | gzip -9 \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE \
            > "$file"
          echo "dump size: $(du -h "$file" | cut -f1)"
          rclone copy "$file" "$BACKUP_REMOTE/" --no-traverse
          # prune remote copies older than 14 days
          rclone delete "$BACKUP_REMOTE/" --min-age 14d --include "reachflow-*.sql.gz.enc" || true
          echo "backup pushed: $file"
