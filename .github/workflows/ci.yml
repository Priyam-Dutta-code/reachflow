# Phase 0 sanity CI. Phase 11 replaces this with the full pipeline
# (web: lint+tsc+build · api: ruff+pytest · main: SSH deploy with approval).
name: ci

on:
  push:
    branches: ["v2/**"]
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f compose.dev.yml config -q
          # prod skeleton needs required env vars to interpolate
          POSTGRES_PASSWORD=x CLOUDFLARE_TUNNEL_TOKEN=x docker compose -f compose.prod.yml config -q

      - name: API lint + tests
        working-directory: apps/api
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m ruff check app tests
          python3 -m pytest

      - name: API migration applies
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./ci_migrate.db
        run: python3 -m alembic upgrade head

      - name: Web stub syntax
        run: node --check apps/web/server.mjs

      - name: Shell scripts
        run: |
          bash -n infra/*.sh
          shellcheck -S warning infra/*.sh
